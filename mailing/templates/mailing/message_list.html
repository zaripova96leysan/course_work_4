<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список сообщений</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { border-collapse: collapse; width: 100%; max-width: 800px; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .btn { display: inline-block; padding: 10px 15px; background-color: #28a745; color: white; text-decoration: none; border-radius: 5px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <h1>Список сообщений</h1>
    <a href="{% url 'message_create' %}" class="btn">Добавить сообщение</a>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Тема письма</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody>
            {% for message in messages %}
            <tr>
                <td>{{ message.id }}</td>
                <td>{{ message.subject }}</td>
                <td>
                    <a href="{% url 'message_update' message.id %}" style="color: blue; margin-right: 10px;">Редактировать</a>
                    <a href="{% url 'message_delete' message.id %}" style="color: red;">Удалить</a>
                </td>
            </tr>
            {% empty %}
            <tr><td colspan="3">Пока нет ни одного сообщения.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
