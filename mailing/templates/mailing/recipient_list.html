<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список получателей</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { border-collapse: collapse; width: 100%; max-width: 800px; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .btn { display: inline-block; padding: 10px 15px; background-color: #28a745; color: white; text-decoration: none; border-radius: 5px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <h1>Список получателей</h1>

    <a href="{% url 'recipient_create' %}" class="btn">Добавить получателя</a>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Email</th>
                <th>Ф. И. О.</th>
                <th>Комментарий</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody>
            {% for recipient in recipients %}
            <tr>
                <td>{{ recipient.id }}</td>
                <td>{{ recipient.email }}</td>
                <td>{{ recipient.full_name }}</td>
                <td>{{ recipient.comment }}</td>
                <td>
    <a href="{% url 'recipient_update' recipient.id %}" style="color: blue; margin-right: 10px;">Редактировать</a>
    <a href="{% url 'recipient_delete' recipient.id %}" style="color: red;">Удалить</a>
</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="5">Пока нет ни одного получателя.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
