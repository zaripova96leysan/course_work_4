<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Удалить получателя</title>
</head>
<body>
    <h1>Удалить получателя?</h1>
    <p>Вы уверены, что хотите удалить <strong>{{ recipient.full_name }} ({{ recipient.email }})</strong>?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" style="background-color: red; color: white; padding: 10px; border: none; cursor: pointer;">Да, удалить</button>
        <a href="{% url 'recipient_list' %}" style="margin-left: 10px;">Отмена</a>
    </form>
</body>
</html>
